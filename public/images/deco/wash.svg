<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" preserveAspectRatio="none">
  <!-- soft watercolor wash: blurred blobs with a paper-grain displacement -->
  <defs>
    <filter id="w" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="38"/>
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .4  0 0 0 .07 0"/></filter>
  </defs>
  <g filter="url(#w)">
    <ellipse cx="80" cy="60" rx="150" ry="90" fill="#cfe5c8" opacity=".75"/>
    <ellipse cx="540" cy="250" rx="170" ry="100" fill="#ffe3a8" opacity=".7"/>
    <ellipse cx="470" cy="40" rx="110" ry="60" fill="#f7cdb9" opacity=".45"/>
    <ellipse cx="200" cy="270" rx="120" ry="60" fill="#d6ecf2" opacity=".5"/>
  </g>
  <rect width="600" height="300" filter="url(#g)"/>
</svg>
