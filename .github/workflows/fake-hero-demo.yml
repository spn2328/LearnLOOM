name: Fake Hero demo checks

on:
  pull_request:
    branches:
      - docs/fake-hero-demo-plan
      - main
    paths:
      - "features/fake-hero/**"
      - "demo/**"
      - "docs/fake-hero/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/fake-hero-demo.yml"
  push:
    branches:
      - feat/fake-hero-interactive-demo
      - feat/fake-hero-complete-ep01

jobs:
  validate-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Source checks
        run: pnpm test
      - name: Verify EP01 question bank
        run: node scripts/test-fake-hero.mjs
      - name: TypeScript checks
        run: pnpm typecheck
      - name: Build Vercel browser demo
        run: pnpm build:demo
